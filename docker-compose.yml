services:
    migrate:
        profiles:
            - tools
        image: ghcr.io/ischemist/syntharena-migrate:latest
        build:
            context: .
            target: migrate-runner
        env_file: .env
        environment:
            DATABASE_URL: file:/app/data/prod.db
        volumes:
            - ${SYNTHARENA_DATA_DIR:-./production_data}:/app/data
        user: '1002:1002'

    app:
        container_name: syntharena-app
        image: ghcr.io/ischemist/syntharena:latest
        build:
            context: .
            target: runner
        ports:
            - '1000:3000'
        env_file: .env
        environment:
            DATABASE_URL: file:/app/data/prod.db
        volumes:
            - ${SYNTHARENA_DATA_DIR:-./production_data}:/app/data
        restart: unless-stopped
        user: '1002:1002'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s
