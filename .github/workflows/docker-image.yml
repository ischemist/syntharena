name: Docker Image

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build Docker images
        runs-on: blacksmith-4vcpu-ubuntu-2404

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set image tags
              id: image
              run: |
                  IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
                  MIGRATE_IMAGE="${IMAGE}-migrate"
                  CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  TAGS="${IMAGE}:sha-${GITHUB_SHA}"
                  MIGRATE_TAGS="${MIGRATE_IMAGE}:sha-${GITHUB_SHA}"
                  if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
                    TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
                    MIGRATE_TAGS="${MIGRATE_TAGS}"$'\n'"${MIGRATE_IMAGE}:latest"
                  fi
                  {
                    echo "image=${IMAGE}"
                    echo "created=${CREATED}"
                    echo "tags<<EOF"
                    echo "${TAGS}"
                    echo "EOF"
                    echo "migrate-image=${MIGRATE_IMAGE}"
                    echo "migrate-tags<<EOF"
                    echo "${MIGRATE_TAGS}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker builder
              uses: useblacksmith/setup-docker-builder@v1
              with:
                  max-cache-size-mb: '10240'

            - name: Build app image
              uses: useblacksmith/build-push-action@v2
              with:
                  context: .
                  target: runner
                  push: true
                  tags: ${{ steps.image.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ steps.image.outputs.created }}

            - name: Build migration image
              uses: useblacksmith/build-push-action@v2
              with:
                  context: .
                  target: migrate-runner
                  push: true
                  tags: ${{ steps.image.outputs.migrate-tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ steps.image.outputs.created }}
