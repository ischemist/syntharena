name: Docker Image

on:
    push:
        branches: [master]
    workflow_dispatch:
        inputs:
            export_artifact:
                description: Export the exact app image as a deployment artifact
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build Docker images
        runs-on: blacksmith-4vcpu-ubuntu-2404

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set image tags
              id: image
              run: |
                  IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
                  MIGRATE_IMAGE="${IMAGE}-migrate"
                  CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  TAGS="${IMAGE}:sha-${GITHUB_SHA}"
                  MIGRATE_TAGS="${MIGRATE_IMAGE}:sha-${GITHUB_SHA}"
                  if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
                    TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
                    MIGRATE_TAGS="${MIGRATE_TAGS}"$'\n'"${MIGRATE_IMAGE}:latest"
                  fi
                  {
                    echo "image=${IMAGE}"
                    echo "created=${CREATED}"
                    echo "tags<<EOF"
                    echo "${TAGS}"
                    echo "EOF"
                    echo "migrate-image=${MIGRATE_IMAGE}"
                    echo "migrate-tags<<EOF"
                    echo "${MIGRATE_TAGS}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker builder
              uses: useblacksmith/setup-docker-builder@v1
              with:
                  max-cache-size-mb: '10240'

            - name: Build app image
              id: app-build
              uses: useblacksmith/build-push-action@v2
              with:
                  context: .
                  target: runner
                  push: true
                  tags: ${{ steps.image.outputs.tags }}
                  build-args: |
                      SYNTHARENA_DEPLOYMENT_SHA=${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ steps.image.outputs.created }}

            - name: Build migration image
              uses: useblacksmith/build-push-action@v2
              with:
                  context: .
                  target: migrate-runner
                  push: true
                  tags: ${{ steps.image.outputs.migrate-tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ steps.image.outputs.created }}

            - name: Export exact app image
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_artifact }}
              env:
                  DIGEST: ${{ steps.app-build.outputs.digest }}
                  IMAGE: ${{ steps.image.outputs.image }}
              run: |
                  REF="${IMAGE}@${DIGEST}"
                  TAG="${IMAGE}:sha-${GITHUB_SHA}"
                  ARCHIVE="syntharena-${GITHUB_SHA}.tar"
                  docker pull "${REF}"
                  docker tag "${REF}" "${TAG}"
                  docker save --output "${ARCHIVE}" "${TAG}"
                  sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
                  printf '%s\n' "${REF}" > "${ARCHIVE}.image-digest"

            - name: Upload exact app image
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_artifact }}
              uses: actions/upload-artifact@v4
              with:
                  name: syntharena-deployment-image-${{ github.sha }}
                  path: |
                      syntharena-${{ github.sha }}.tar
                      syntharena-${{ github.sha }}.tar.sha256
                      syntharena-${{ github.sha }}.tar.image-digest
                  compression-level: 0
                  retention-days: 1
