[package]
name = "syntharena-corpus-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.54", features = ["derive"] }
csv = "1.4.0"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
libc = "0.2.180"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
